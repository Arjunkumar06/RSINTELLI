<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Orbital Ring Cyan Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Solar Panel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    
    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Halo -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGlow)" />

  <!-- Outer Orbital Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="180 30" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Dashed Target Tech Ring -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 6" />

  <!-- Radar Crosshairs -->
  <line x1="50" y1="8" x2="50" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="50" y1="80" x2="50" y2="92" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="8" y1="50" x2="20" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="80" y1="50" x2="92" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Satellite Body & Solar Wings -->
  <g transform="rotate(-35 50 50)" filter="url(#glow)">
    <!-- Left Solar Array -->
    <rect x="18" y="45" width="20" height="10" rx="2" fill="url(#panelGrad)" stroke="#e0f2fe" stroke-width="0.8"/>
    <line x1="25" y1="45" x2="25" y2="55" stroke="#090e17" stroke-width="0.8"/>
    <line x1="32" y1="45" x2="32" y2="55" stroke="#090e17" stroke-width="0.8"/>

    <!-- Right Solar Array -->
    <rect x="62" y="45" width="20" height="10" rx="2" fill="url(#panelGrad)" stroke="#e0f2fe" stroke-width="0.8"/>
    <line x1="68" y1="45" x2="68" y2="55" stroke="#090e17" stroke-width="0.8"/>
    <line x1="75" y1="45" x2="75" y2="55" stroke="#090e17" stroke-width="0.8"/>

    <!-- Satellite Core Body -->
    <rect x="41" y="41" width="18" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="50" cy="50" r="4" fill="#10b981"/>

    <!-- Lens Antenna Sensor -->
    <path d="M46 59 Q50 66 54 59" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 24/7 Live Status Dot -->
  <circle cx="78" cy="22" r="4.5" fill="#10b981" filter="url(#glow)"/>
</svg>
